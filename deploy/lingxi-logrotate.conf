# lingxi 主日志轮转配置。
# 安装(任选其一):
#   sudo cp deploy/lingxi-logrotate.conf /etc/logrotate.d/lingxi
#   或软链:sudo ln -sf "$(pwd)/deploy/lingxi-logrotate.conf" /etc/logrotate.d/lingxi
# 立即验证: sudo logrotate -f /etc/logrotate.d/lingxi
#
# 背景:deploy/lingxi.service 与 start.sh 都用 `>> records/lingxi_server.log` 追加(进程持有该 fd),
# 故必须用 copytruncate(先复制再就地清空),让进程的 open fd 继续写入被截断后的文件,无需重启。
# 实测该日志曾累计 22 万行/数十 MB(含每 60s 充提复核刷屏),无轮转会无限增长。

/root/lingxi/records/lingxi_server.log {
    daily
    rotate 7
    size 50M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
