# lingxi 配置覆盖（仅列出与默认值不同的项；未列出的键沿用 internal/core/defaults.go 默认值）。
# 用户 2026-06-19 拍板:profit_seeking + 满仓 + 3× 起步(可调至 5×)。
# ⚠️ profit_seeking 会在加载时经 ApplyStrategyModeToEconomics 强制收紧成本闸(auto_derive/impact/min_net≥0.002/basis 收回),
#    显著减少开单数——与「最大化开仓/满仓」存在张力,属刻意取舍。
# ⚠️ 生产配置改动:部署前须人工 review + 重新部署进程。
# 运行形态:enable_rolling_hold=true → 跨周期滚动持有(:55 复核续持);**生产主路径**为五策略统一轮动 runner(perp-perp 经 binding 派发,非独立循环)。

strategy:
  # 用户 2026-06-19 拍板:profit_seeking + 满仓 + 3× 起步(可调至 5×)
  # 加载后自动收紧: auto_derive_fee_reserve=true / impact_reserve_in_gate=true / min_net≥0.002 / basis≤0.0015 / open_spread_apr≥1.5
  strategy_mode: profit_seeking
  # 币安单所引擎已退役(2026-06-15);此配额仅影响遗留 FundingRateSniper 路径与 preflight 对照。
  per_symbol_quote_usdt: 30

risk:
  # 用户 2026-06-19 拍板:profit_seeking + 满仓 + 3× 起步(可调至 5×) — 账户级硬停兜底(激进但保留)
  # 【% 权益化】max_*_pct 与同名 USDT 阈值取 max(有效阈值=max(USDT, pct×RealEquityTotalUSDT));0=仅 USDT。
  # 例:max_daily_loss_pct / max_account_drawdown_pct / max_strategy_cumulative_loss_pct(默认见 defaults.go)。
  # 2026-07-03 用户决策抬高:fast v2 学费预算=每所本金 30%(OKX 100U→30U),账户级日亏硬停必须 > fast 预算
  # 才不会先于 fast 熔断把全账户停掉(层级:fast 30U 先熔,slow/其他所照跑;账户级 35U 是最终兜底)。
  # 代价=接受单日最大约 22% 权益回撤(160U 口径),用户明确接受(2026-07-03 01:59 对话)。原值 8U(7-02 校准)。
  max_daily_loss_usdt: 35
  # 账户回撤闸口径=「全部历史 settlements 累计净利曲线自高水位的回撤」(含全部探索学费≈86U),阈值须计入已发生部分。
  max_account_drawdown_usdt: 115
  # directional_okx 全期累计已 -52(探索学费);80 = 再给 ~28U 探索预算,到点硬停须人工确认。
  max_strategy_cumulative_loss_usdt: 80
  max_account_open_notional_usdt: 2200
  # 当日错次预算:单个 UTC+8 自然日内"已结算且净亏"的笔数达到此值即账户级一级硬停(停新开仓,在场仓继续 manage)。
  # 当日错次预算:0=关闭。微仓广撒网的常态就是大量小额亏单(百笔/日),笔数维度对 scalper 无意义,
  # 金额维度(max_daily_loss_usdt)才是有效刹车;保留 0 防每分钟 critical 刷屏。
  daily_max_losing_trades: 0
  # 2026-06-21 止血:二级 auto-flatten 暂时关闭。其触发依据(RealEquityPeak/Drawdown)目前坐在不可信的
  # 权益快照上(已发现单样本毛刺设峰 454.9U、残缺 venue 读把总额算成≈0),会把毛刺/提现误判成回撤而误平健康仓。
  # 在 equity_snapshots 质量闸 + fund-flow 调整后判据上线并验证前,先置 false(belt);代码版降级见 account_risk_watch.go。
  auto_flatten_on_hard_drawdown_enabled: false
  # 【对齐真实余额,O-5】单周期开仓名义上限:与 per_symbol_quote_usdt×2 同步(60),币安 ~99U 余额 preflight 对照。
  max_cycle_open_notional_usdt: 60
  # 硬约束 immediate_invalidate_rate < min_net_profit_rate;profit_seeking 加载后 min_net 抬至 ≥0.002(默认 0.002)。
  immediate_invalidate_rate: 0.00005
  # R7b 可信反转门槛（修正 EDENUSDT 类误杀）
  funding_reversal_confirm_ratio: 0.5
  # R7c 前瞻基差同号守卫（EDENUSDT 误杀根因之一）
  conflicting_premium_sign_guard_enabled: true
  # R29 借币容量守卫(开仓前预检)
  borrow_capacity_check_enabled: true
  # 借币不可用降级:合约腿已回补时不计执行事故熔断
  borrow_unavailable_non_fatal_enabled: true

portfolio:
  # 实盘：开启跨周期滚动持有（吃完一次后在 :55 复核，能吃就续持、不能吃就平仓）。
  enable_rolling_hold: true

historical:
  # 回测成本按三档 BNB 抵扣后折算（现货 -25% / 合约 -10% / 借币利息 -5%）
  spot_taker_fee_rate: 0.00075
  futures_taker_fee_rate: 0.00045
  assumed_hourly_borrow_interest_rate: 0.0000475
  # 回测的「滚动持有」由本项控制（≠ 实盘的 enable_rolling_hold）：最多持有 3 个 funding 周期。
  max_funding_cycles_held: 3

network:
  # 监听所有网卡,通过机器 IP+端口(8080)直接访问面板,不再依赖 tailscale/本地回环。
  dashboard_addr: "0.0.0.0:8080"

# P1 跨所 perp-perp 执行引擎(空高费所/多低费所 delta 中性)。
# 【统一 runner】开仓由 UnifiedRotationRunner 经 bindCrossVenuePerpPerpRotationExecutor 派发;
#   非独立 Run() 循环(run.go: SetRotationManaged(true)+SetOpeningsEnabled(false))。
# 【名义上限】max_position_usdt 为硬顶;实际单仓名义=min(硬顶, 流动性 cap liquidity_sizing.go, 全局预算)。
# 【未列出的 sizing/滑点键】沿用 defaults: sizing_max_slippage_bps / sizing_max_participation_pct_24h /
#   sizing_conservative_no_depth_factor / slippage_budget_bps / taker_slippage_budget_bps 等。
cross_venue_executor:
  enabled: true
  live_trading_enabled: true
  # perp-perp 结算前进场窗(秒):统一 runner 每 60s 基于 scanner 缓存快照做 perp-perp 高频决策,3min 可稳定接住结算档。
  open_funding_lead_seconds: 180
  # 用户 2026-06-19 拍板:profit_seeking + 满仓 + 3× 起步(可调至 5×) — 最大化并发/单腿名义
  max_concurrent: 8
  max_position_usdt: 150
  # ↑ 硬顶(USDT);实际名义还受 liquidity_sizing 与 runner 预算约束,非固定满仓此数。
  # 用户 2026-06-19 拍板:3× 杠杆起步;MaxEffectiveLeverage 同时驱动开仓前设杠杆与 sizing 口径
  max_effective_leverage: 3
  # 保留保证金安全垫(不因提杠杆而移除);可用 USDT ≥ 名义/杠杆 × 此系数
  margin_safety_factor: 1.5
  # profit_seeking 加载后 open_spread_apr 强制 ≥1.5(默认 150%);此处不覆盖,由模式收紧
  close_spread_apr: 0.20
  maker_first: true
  maker_chase_rounds: 6
  maker_chase_interval_ms: 1500
  maker_deadline_seconds: 12
  # N-3: 材料级未登记腿(过滤 dust 后)冷启动自动 IOC flatten;重启后对 bybit MNT≈$9.7 等真实残留下卖单。
  # 此后任何材料级未登记腿均走 flatten,非仅 MNT。
  untracked_exposure_action: flatten
  # 统一资费捕获模型(用户 2026-06-23 拍板:全量实盘,不灰度)。
  # 进场对齐"实际付钱的腿"结算 / EV 同口径(计划持有 horizon + maker 一致滑点) /
  # 离场由计划治理(持有到目标结算+缓冲,价差噪声不再抖动平仓) / 基差止损为真正风控。
  # 一键回滚:改回 false 重启即恢复旧逻辑。白名单留空=对所有 perp-perp 币生效。
  unified_capture_model_enabled: true
  # 每笔默认目标结算次数 N(1=单次目标结算,基差暴露最小);N>1 仅在基差稳定分达标时放行。
  capture_target_settlements: 1
  # 基差止损预算 = 此系数 × 预期目标资费;开仓以来累计不利基差 PnL 超过预算即平。
  # 1.5:给基差均值回归留空间(单结算预期资费小,1.0 会被结算点正常噪声频繁触发→小赚大亏)。
  basis_stop_budget_fraction: 1.5
  # 基差止损迟滞:不利基差需连续此轮数(manage 每轮≈60s)都超预算才止损,挡结算点瞬时插针把均值回归噪声锁成实亏。
  basis_stop_confirm_checks: 2
  # 滚动续持:计划离场点若同一对下个目标结算仍净收资费+基差安全,则延长持有而非平仓重开,免去对稳定复现
  # 资费源每周期白付一趟往返(LAB 即此:连续多小时被反复开平,3 趟往返吃掉 3 次资费)。每次都重校资费+基差,不稳即平。
  capture_roll_enabled: true
  # 单笔最多滚动续持次数(上限总持有周期;MaxHold 仍为硬顶)。
  capture_max_rolls: 6
  # 对冲 carry 持有到计划离场:开后不再做持有期主动止损(关闭基差止损 + 轮动层续持边际转负软平)。
  # perp-perp 两腿同标的、基差均值回归,持有期主动平多在薄盘把"省几分钱预期成本"变成"穿价实亏几 U"
  # (B3 即此:续持净 -0.109 想省 0.1,gate 出场实滑 -3.5)。只留计划离场/roll、结算前净付保护、最大持有硬顶、
  # 裸腿/对账/下架安全平腿。设 false 可恢复旧的持有期主动止损。
  carry_hold_to_planned_exit_enabled: true
  # 入场硬条件:预期目标资费 / 往返成本 ≥ 此比值,挡掉"滑点远大于资费"的薄盘暴力小币。
  capture_funding_to_cost_min_ratio: 1.0
  # 下单前实时资费复核:进场窗内真正下第一腿之前重拉两腿最新资费(离结算越近越收敛),若目标腿资费已翻向或
  # 较快照塌缩过半则放弃本单——根治"用旧快照赌短周期(1h)腿结算时翻盘"(LAB 即此)。拉取失败 fail-open 沿用快照。
  open_funding_refresh_enabled: true
  # 单笔下注单元:把单笔最坏可控亏损(基差止损预算)钉死在 此比例 × 该腿名义 之内;只会更早止损,不会放大。0=不封顶。
  per_trade_max_loss_pct: 0.08
  # 统一模型 maker-first 下 maker(首/高费)腿盘口价差上限(bps);taker(低费)腿仍用 max_book_spread_bps(默认30)严控。
  # 暴力薄盘币 maker 腿盘口天然偏宽,我们挂单不穿价,放宽避免误杀。≤max_book_spread_bps 则不放宽。
  maker_leg_max_book_spread_bps: 80
  # 暴力度软调仓:统一模型下 sizeMult ×= (1 + 权重 × ViolenceScore),clamp01 封顶 → 真暴力币向满仓靠拢、绝不超额;
  # 瞬时尖刺(violence≈0)不受影响,P0 防尖峰满仓的保护不破。0=关闭(回退纯置信度调仓)。
  violence_size_boost_weight: 0.3
  # 暴力度软排序:统一模型下正EV机会 rank ×= (1 + 权重 × ViolenceScore),同等净EV下真暴力币排更前(主战场)。0=关闭。
  violence_rank_boost_weight: 0.3

# 跨所资金费扫描器(carry 的选所/选币入口)。
cross_venue_scanner:
  enabled: false             # 已停 carry:关闭扫描器→run.go 一次性短路 scanner+executor+rotation 整条 carry 链(全所转方向量化)
  # 方向交易专用所:从 carry(扫描+跨所配对+单所轮动+统一资金池)中完全剔除,改由 OKX 方向引擎独占、资金独立核算。
  # 这些所仍由 orchestrator 注册供方向引擎使用,但绝不参与任何资金费 carry,避免 carry 与方向引擎抢同一所资金/持仓。
  directional_venues: "okx"

# OKX 方向交易引擎(独立于 carry)。OKX 已被 directional_venues 从 carry 剔除,资金独占。
# 选币:OKX 资费快照按 |费率| 排序;方向:K线 regime(趋势顺势/震荡反转,双向);资费做对齐闸(顺带收资费、不逆扛)。
# 杠杆固定 5X、无日熔断;页面设「交易仓本金 + 止损%」并点开始/停止(control.json 持久化)。
okx_directional:
  enabled: true              # 引擎常驻;实际开新仓须页面点"开始"(control.active)
  live_trading_enabled: true # 真金闸:true 时页面"开始"即真实下单(用户要求实盘、禁影子)
  loop_interval_seconds: 90
  # 杠杆固定 5X(用户拍板,不在页面调)
  leverage: 5
  # 多币并发:每仓本金=交易仓本金/max_concurrent,名义=每仓本金×5X;总满仓名义=本金×5、总风险=本金。
  max_concurrent: 5   # 2026-07-02 22:17 用户指令:10→5(震荡市降失血速度;评判期 50+ 仓不动其他参数)
  # 广撒网:每仓固定名义 7.5U(>最小单5U)。实际持仓数=交易仓本金/(7.5/杠杆)笔,上限 max_concurrent。
  # 10U/所→约6币;要满30币需约45U/所。资金不足时自动按资金可开的最大数量,不会强行缩成开不出的小单。
  per_position_notional_usdt: 7.5
  # 全场扫描周期(分钟):每隔此时长重算 shortlist(综合分=资费+波动+热度+BTC情境)。
  universe_scan_interval_minutes: 30
  candidate_pool_n: 40
  shortlist_n: 20
  # 默认交易仓本金/止损%(页面可覆盖并持久化;各所 control.json 是实际生效源)
  trading_capital_usdt: 30
  stop_loss_pct: 0.05        # 交易仓本金基准:5%(5X 下≈1% 价格)。2026-07-02 对齐:原写 0.20 但 control.json/defaults 实际生效 0.05,消除三源漂移(行为零变化)
  take_profit_pct: 0.30      # ⚠️ 死参数:live 出场走 decideDirectionalPositionAction(quick_tp/分批/棘轮),不读此值;仅遗留单测用
  daily_loss_limit_usdt: 0   # 0=不设日熔断(用户要求)
  # 选币/信号
  universe_top_n: 20   # 探索高频档:20(原12)——更宽候选池
  min_funding_abs_per_interval: 0.0005
  candle_bar: "5m"
  candle_limit: 120
  ema_fast: 9
  ema_slow: 30
  trend_efficiency_threshold: 0.30
  zscore_entry: 1.0   # 探索高频档:1.0(原1.2)——震荡反转信号触发更频繁
  require_funding_alignment: true
  funding_veto_abs_per_interval: 0.0015   # 资费强逆否决阈值(与选币阈值解耦,只挡明显逆持仓的资费)
  cost_floor_bps: 40   # 探索高频档:40(原60)——放行更多小波动机会
  open_taker_fallback_bps: 30   # 探索高频档:开仓 maker 挂不上时以≤30bps IOC 吃单兜底(提高成交率/频率;0=纯maker)。价差闸已限<20bps,薄盘不会触发
  max_hold_minutes: 60          # 快进快出:不久持,停滞即让位
  symbol_cooldown_minutes: 30
  # 快进快出小止盈(本金口径):浮盈达此值即全平落袋(吃到就赚到),数据强延续才改骑乘加仓
  quick_tp_pct: 0.12
  # 移动保盈棘轮:浮盈高水位过 breakeven_arm_pct(默认5%)后,锁利线=max(峰值×trail_lock_fraction, 峰值−trail_gap_pct);
  # 回吐到锁利线即落袋。修复原"峰值<间距时只保本"的死区——冲到+6~10%又回头的趋势追高单至少锁住一半利润,不再全额回吐成亏。
  trail_lock_fraction: 0.5    # 锁住峰值的一半(峰值+10%→至少落袋+5%)
  trail_gap_pct: 0.06         # 高峰值时的绝对回撤间距(峰值−6%),与比例锁利取紧者
  # 分批止盈(scale-out):浮盈首次达 partial_tp_trigger_pct(须<quick_tp_pct)且未分批过→先落袋 partial_tp_fraction,
  # 剩余仓位继续骑棘轮/快进快出博趋势。根治"很少赚":大量单冲到+6~10%没够到+12%全平就回吐,分批后这部分已落袋。
  partial_tp_trigger_pct: 0.06
  partial_tp_fraction: 0.5
  # 防陷阱入场质量闸(不陷波动/单边/暴拉回调/抄底/追高/滚仓)
  spike_bar_pct: 0.03            # 最后一根同向涨跌≥3% 视为暴拉尖刺,趋势态不追
  trend_max_extension_pct: 0.02  # 趋势入场价离快EMA>2% 视为过度延展,不追
  vol_expansion_max_ratio: 1.8   # 震荡态近窗波动/基线>1.8 视为区间在破,不反转
  reversion_knife_pct: 0.015     # 反转时极值仍以≥1.5%/根延续(急跌急拉)不接(防接飞刀/追空顶)
  loss_cooldown_multiplier: 3    # 止损平仓后该币冷却×3,防滚仓/亏损币快速复入
  # 趋势单根治(复盘 trend 胜率仅 25% vs range 53%,系统性追高):
  trend_entry_pullback_max_bar_pct: 0.005  # 趋势态只在最后一根顺势涨跌≤0.5%(回踩/横盘)入场,不追顺势暴动当根(买回踩不买尖顶)
  trend_size_fraction: 0.5                 # 趋势单仓位减半(胜率低少冒险,资金偏向 range 反转单)
  # 最低开仓信心闸(跨所印证后口径):离线回测证实只有高信心档有正 edge(≥0.7 命中59%/扣10bps后净+0.13%笔),
  # 低信心档确定性亏损。只做高信心档把薄 edge 做厚:频次降约3/4,换「净亏→净正」。0=关闭。
  min_open_conviction: 0.55   # 探索高频档:0.55(原0.70)——更多信号过闸采样(微仓每笔仅~0.2U风险)
  # 信号反转最小持有(分钟):开仓后此时长内不因信号反转立即平仓(防5m噪声急翻churn,白付往返成本);窗口内仍由硬止损兜底。
  # 离线验证:0→30min 单笔期望+0.12%→+0.33%、胜率42%→46%(maker口径),且与OKX/Bybit实盘反转churn互证。
  reversal_min_hold_minutes: 30
  # 单币跨所集中度上限:同一币+同方向最多 N 个所同时持有(读 peer 持仓文件)。根治跨所印证致四所同币同向同开→齐亏的
  # 相关性集中(如 BICO 三所 7min 同步 -2.76U)。降相关回撤、不改单笔 edge。0=不限。
  max_venues_per_symbol_side: 2
  # BTC 追势过滤:剔除与 BTC 近期方向同向的开仓。离线实证:顺BTC近30min方向 edge为负(44%/-0.03%),
  # 逆BTC方向 为正(57%/+0.14%)——追在 BTC 带动的延展末端被反杀。只开逆BTC/BTC横盘的单。
  avoid_btc_chase: false   # 关闭:44%vs57%来自单一窗口+重叠样本,统计不稳健,待更多数据再议
  btc_chase_lookback_bars: 6      # 5m×6=30min
  btc_chase_min_move_pct: 0.0008  # BTC 净移动>0.08% 才算有方向
  # ===== 2026-07-02 重建(工作区事故后按会话记录恢复;各键详注见 internal/core/config.go)=====
  # 阶段2A 开仓微结构埋点(record-only):settlements 带 open_micro 上下文,是 runup 闸与微结构归因的数据源。
  open_micro_record_enabled: true
  # regime 风险降档(只缩新开仓名义 7.5→5U,不停机):命中桶 PF 0.34 vs 非命中 0.73(n=124/379)。
  # ⚠️ 方法学警示:依据是同集 in-sample 分桶(无 holdout),上线后实录 n=26 方向相反——slow-only 样本到 30+ 若仍反向须回滚。
  regime_degrade_enabled: true
  regime_degrade_action: "downsize"
  # MAE 灾难刹车(§11.2):20s 快速风控里浮亏(本金口径)触及 -3% 即市价平仓(reason=mae_disaster_cut)。
  # 离线反事实(541 微仓样本):触及 -3% 后 89% 最终仍亏,当场砍改善 +4.3U/292仓(分所全为正)。
  # 只影响出场(比 stop_loss_pct=5% 更浅的灾难闸),不影响开仓/信号。灰度=okx,bybit;回滚:enabled:false + 重启。
  mae_disaster_cut_enabled: true
  mae_disaster_cut_pct: 0.03
  mae_disaster_cut_venues: "okx,bybit"
  # runup 临门确认闸:开仓时刻 pre_open_runup_bps<0(信号后价格仍逆行=反转未确认)拒开(reason=runup_confirm)。
  # 依据(slow-only 530 仓,跨前后半窗稳定):runup<0 桶 PF 0.44-0.53;OKX 上 0.30 vs 0.93。灰度=okx;micro 缺失放行。
  runup_confirm_filter_enabled: true
  runup_confirm_min_bps: 0
  runup_confirm_venues: "okx"
  # fast 数据采集:fast_ws(OKX 逐笔+盘口,事件研究/结算瞬间研究数据源)保留;
  # fast_peer(跨所 lead-lag)已被大样本证伪(领先→跟随不可用),2026-07-02 停采省 ~1GB/天。
  fast_ws_collector_enabled: true
  fast_peer_ws_enabled: false
  # 动机层采集(2026-07-03,record-only):全市场 SWAP 爆仓单 → fast_liquidation_events.jsonl。
  # 因子哲学:"被迫的行为最可预测"——强平流是动机维度含金量最高的原料;挂在 fast_ws 连接上,零交易影响。
  fast_liq_collector_enabled: true
  # v3 蓝图(2026-07-03 批准并当日全开。16:44 用户纠偏:秒级策略 2h=数万决策周期,机制核实即动,
  # 禁止"攒24h/明天再说"日历思维——数据是结果,机制先行,结果只用来核对预言):
  # ① 池塘过滤【开】:在线滚动判定与离线 119k 排名吻合(OK=LAB/ZKP/KORU/SLX/SOXL;REJ 含 CELO/SNDK/MRVL);
  #   反事实核实 REJ 池实盘全亏。死水/薄盘不下场,不跟机构抢镜面盘。
  fast_pond_min_energy_bps: 8
  fast_pond_depth_lo_usdt: 5000
  fast_pond_filter_enabled: true
  # ② 接型候选:fade_exhaustion 实盘灰度【开,仅成熟OK池塘】——机制=接力竭FOMO(做"被迫一次性taker"
  #   的对手方=唯一毛正物种B的镜像),前向核实 +60s+1.5bps/+180s+4.65bps 单调放大形状。
  #   liq_catch 永远硬闸(已证伪:被迫流持续1-3分钟,60s接刀三桶全负;其镜像 liq_follow 离线继续跟踪)。
  fast_alt_candidates_enabled: true
  fast_fade_min_impulse_bps: 8
  # fade 实盘降回 record-only(2026-07-03 21:10 解剖裁决,非砍掉了事):35笔实盘 vs 同期9032全体候选,
  #   信号口径前向 -10.6bps vs +1.0bps@60s——maker成交本身=力竭诊断被证伪(诊断对→价格反转碰不到挂单;
  #   诊断错→人群还有子弹砸穿挂单才成交)。群体优势+1.0bps付不起任何执行成本(taker~5bps),无可收割形态。
  #   shadow 候选照常生成(fast_alt_candidates_enabled 不动),优势若增厚可重估。
  fast_fade_live_enabled: false
  # ③ 物种化出场【开】:A=3s深亏≤-6bps立断(豁免minHold,424笔实证PF0.26仅26%回正)/
  #   C=10s无正反馈快撤换弹(PF0.51)/B(打完即弹PF1.50)不动交给trail。
  fast_species_exit_enabled: true
  # ④ liq_follow 事件驱动全市场入场(2026-07-03 17:41 用户架构纠偏:"禁止漏斗套漏斗,挑选范围=全市场,
  #   资格当刻判定"):爆仓推送(全部SWAP)→热队列→秒级现场验资格(点差≤12bps/深度5k-15万)→顺被迫流taker进场。
  #   离线:liq_follow 镜像 1622 事件四窗口全正(+60s +6.5bps),今日最稳机制。
  #   限频礼让(账号安全):每秒≤2币≤4个公共请求;连续失败退让60s;绝不硬扛 50011。
  fast_liq_follow_live_enabled: true
  fast_liq_follow_min_liqs: 2
  fast_liq_follow_max_spread_bps: 12
  fast_liq_follow_depth_hi_usdt: 150000
  # ⑥ v4 换枪(2026-07-03 20:32 用户拍板"听你的 我相信你";606笔全量解剖依据见 HANDOFF 全量反思):
  #   scorer 轮询线降级 record-only(占91%子弹净-2.67U,成交后3s顺向占优仅12%,60%单子无肉,
  #   maker edge越大死得越惨=逆选择税;shadow 照记当地图)。实盘子弹全部让给事件驱动线。
  fast_scorer_live_enabled: false
  #   liq_follow 加瀑布存活确认:15s冲量与被迫流同向且≥5bps 才进(死瀑布=接反转,唯一+21bps
  #   舒服单 imp30=-192 顺势印证);盲区闸(零历史不进)之后的第二道能量释放闸。
  fast_liq_follow_min_imp15_bps: 5
  # ⑤ 出场能量单位制【开】(2026-07-03 19:11 逐笔对账钉死:管线无bug、方向全对,但出场尺子还是死水池刻度——
  #   LAB能量30.7bps下25bps灾难线=0.8个噪声步长,14笔灾难止损7笔/12笔A斩7笔在180s内回到更优价=收割自己选的能量。
  #   能量成熟池:灾难=2.0×能量中位/止损=1.2×/A斩=0.6×/TP=0.8×,均不低于原绝对下限;能量未知回退原值)。
  fast_exit_energy_scale_enabled: true
  # fast 实盘线 v2 重启(2026-07-03 用户决策,有意越过三闸——依据:交易所账本重建 6304 笔 v1 往返解剖,
  # 亏损集中在 <15s 出场翻炒(毛均 -12.8bps/PF 0.20),60-180s 桶毛正(+2.7bps/PF 1.36),信号方向真实存在。
  # v2 = 只修出场时序,不动打分器:minHold 60s 内禁亏损驱动出场 + 灾难线 40bps 防插针 + fast 层日亏 3U 熔断。
  # 灰度:仅 OKX、名义 5U;结算带 fast_exit_version=v2 且另存 fast_v2_settlements.jsonl 供分代对照分析。
  fast_scalper_v1_enabled: true
  fast_live_enabled: true
  fast_live_notional_usdt: 5
  # minHold=30s:账本细分桶显示 0-30s 全负(0-10s 毛均-15.6bps),30-45s/45-60s 桶 PF≈2 全曲线最强;
  # 60s 会把最优出场窗口锁在门外(2026-07-03 与用户对齐)。
  fast_min_hold_seconds: 30
  # 灾难线 40→25(v2 数据标定:胜单最深回撤 P50=-1.9bps、几乎无胜单破 -25;灾难单 10s 内已 -26bps,早砍省 15-20bps/笔)
  fast_disaster_stop_bps: 25
  # fast 学费预算=本所交易本金×30%(OKX 100U→30U;随页面调本金自动缩放;触发当日停开 fast,北京日切恢复)
  fast_daily_loss_pct_of_capital: 0.30
  # ===== v2.2 自适应惩罚(2026-07-03,替代"禁开"黑名单;广撒网不收网,让重复失败变贵)=====
  # v1 账本教训:同币日内无上限重复锤(CELO 两天 1124 笔)贡献 96% 出血 → 亏损退避:该币每亏一档,
  # 冷却 300s×3^档(15m/45m/…cap 2h)+ 再入场门槛 +0.05/档(cap +0.25);赢单降档,北京日切重置。
  fast_loss_cooldown_backoff_factor: 3
  fast_loss_cooldown_cap_seconds: 7200
  fast_loss_score_bump_per_loss: 0.05
  fast_loss_score_bump_cap: 0.25
  # 弱时段(v1:UTC 00-08 占一半亏损):不禁开,门槛 +0.10 且名义×0.5,便宜地继续采样,数据够了再评估是否可救
  fast_weak_hours_utc: "0-7"
  fast_weak_hours_score_bump: 0.10
  fast_weak_hours_notional_frac: 0.5

# 五策略统一资金费轮动 runner。perp-perp 执行体见 cross_venue_executor,开仓由 runner binding 派发。
# total_deployable_usdt: 绝对预算(USDT);另有 total_deployable_pct(默认见 defaults,占真实现金权益比例),二者与 equity 取 min。
unified_rotation:
  enabled: true
  live_trading_enabled: true
  # 用户 2026-06-19 拍板:profit_seeking + 满仓 + 3× 起步(可调至 5×) — 全局资金预算
  total_deployable_usdt: 435
  max_strategy_capital_usage_pct: 0
  # 2026-06-21:必须显式开启,否则 RotationConfigFromUnified 会用零值 false 覆盖默认 true,
  # 导致 perp-perp 名义不按"各所可用×杠杆"封顶,死顶 80→所需正好等于可用→49.99<50 每轮被执行闸拒(H 永远开不出来)。
  capital_aware_perp_perp_sizing_enabled: true
  # 资金封顶安全垫:按 99% 可用反解名义,使所需保证金严格小于实时 perp 可用,避免 reserve/取整 drift 几分钱误拒。
  capital_sizing_safety_haircut: 0.99
  # 换仓优势安全垫(USDT):新候选净优势须超过此值才换仓,而非略优即换——挡掉换仓真实往返 +
  # "平旧失败/新仓开不出→两头落空" 执行风险 + 新候选单结算乐观 EV(BLEND 即此:换仓吃了资费却净亏 -0.355)。
  switch_min_advantage_usdt: 0.10

