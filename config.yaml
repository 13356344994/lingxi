# lingxi 配置覆盖（仅列出与默认值不同的项；未列出的键沿用 internal/core/defaults.go 默认值）。
# 用户 2026-06-19 拍板:profit_seeking + 满仓 + 3× 起步(可调至 5×)。
# ⚠️ profit_seeking 会在加载时经 ApplyStrategyModeToEconomics 强制收紧成本闸(auto_derive/impact/min_net≥0.002/basis 收回),
#    显著减少开单数——与「最大化开仓/满仓」存在张力,属刻意取舍。
# ⚠️ 生产配置改动:部署前须人工 review + 重新部署进程。
# 运行形态:enable_rolling_hold=true → 跨周期滚动持有(:55 复核续持);**生产主路径**为五策略统一轮动 runner(perp-perp 经 binding 派发,非独立循环)。

strategy:
  # 用户 2026-06-19 拍板:profit_seeking + 满仓 + 3× 起步(可调至 5×)
  # 加载后自动收紧: auto_derive_fee_reserve=true / impact_reserve_in_gate=true / min_net≥0.002 / basis≤0.0015 / open_spread_apr≥1.5
  strategy_mode: profit_seeking
  # 币安单所引擎已退役(2026-06-15);此配额仅影响遗留 FundingRateSniper 路径与 preflight 对照。
  per_symbol_quote_usdt: 30

risk:
  # 用户 2026-06-19 拍板:profit_seeking + 满仓 + 3× 起步(可调至 5×) — 账户级硬停兜底(激进但保留)
  # 【% 权益化】max_*_pct 与同名 USDT 阈值取 max(有效阈值=max(USDT, pct×RealEquityTotalUSDT));0=仅 USDT。
  # 例:max_daily_loss_pct / max_account_drawdown_pct / max_strategy_cumulative_loss_pct(默认见 defaults.go)。
  max_daily_loss_usdt: 40
  max_account_drawdown_usdt: 90
  max_strategy_cumulative_loss_usdt: 30
  max_account_open_notional_usdt: 2200
  # 2026-06-21 止血:二级 auto-flatten 暂时关闭。其触发依据(RealEquityPeak/Drawdown)目前坐在不可信的
  # 权益快照上(已发现单样本毛刺设峰 454.9U、残缺 venue 读把总额算成≈0),会把毛刺/提现误判成回撤而误平健康仓。
  # 在 equity_snapshots 质量闸 + fund-flow 调整后判据上线并验证前,先置 false(belt);代码版降级见 account_risk_watch.go。
  auto_flatten_on_hard_drawdown_enabled: false
  # 【对齐真实余额,O-5】单周期开仓名义上限:与 per_symbol_quote_usdt×2 同步(60),币安 ~99U 余额 preflight 对照。
  max_cycle_open_notional_usdt: 60
  # 硬约束 immediate_invalidate_rate < min_net_profit_rate;profit_seeking 加载后 min_net 抬至 ≥0.002(默认 0.002)。
  immediate_invalidate_rate: 0.00005
  # R7b 可信反转门槛（修正 EDENUSDT 类误杀）
  funding_reversal_confirm_ratio: 0.5
  # R7c 前瞻基差同号守卫（EDENUSDT 误杀根因之一）
  conflicting_premium_sign_guard_enabled: true
  # R29 借币容量守卫(开仓前预检)
  borrow_capacity_check_enabled: true
  # 借币不可用降级:合约腿已回补时不计执行事故熔断
  borrow_unavailable_non_fatal_enabled: true

portfolio:
  # 实盘：开启跨周期滚动持有（吃完一次后在 :55 复核，能吃就续持、不能吃就平仓）。
  enable_rolling_hold: true

historical:
  # 回测成本按三档 BNB 抵扣后折算（现货 -25% / 合约 -10% / 借币利息 -5%）
  spot_taker_fee_rate: 0.00075
  futures_taker_fee_rate: 0.00045
  assumed_hourly_borrow_interest_rate: 0.0000475
  # 回测的「滚动持有」由本项控制（≠ 实盘的 enable_rolling_hold）：最多持有 3 个 funding 周期。
  max_funding_cycles_held: 3

network:
  # 监听所有网卡,通过机器 IP+端口(8080)直接访问面板,不再依赖 tailscale/本地回环。
  dashboard_addr: "0.0.0.0:8080"

# P1 跨所 perp-perp 执行引擎(空高费所/多低费所 delta 中性)。
# 【统一 runner】开仓由 UnifiedRotationRunner 经 bindCrossVenuePerpPerpRotationExecutor 派发;
#   非独立 Run() 循环(run.go: SetRotationManaged(true)+SetOpeningsEnabled(false))。
# 【名义上限】max_position_usdt 为硬顶;实际单仓名义=min(硬顶, 流动性 cap liquidity_sizing.go, 全局预算)。
# 【未列出的 sizing/滑点键】沿用 defaults: sizing_max_slippage_bps / sizing_max_participation_pct_24h /
#   sizing_conservative_no_depth_factor / slippage_budget_bps / taker_slippage_budget_bps 等。
cross_venue_executor:
  enabled: true
  live_trading_enabled: true
  # perp-perp 结算前进场窗(秒):统一 runner 每 60s 基于 scanner 缓存快照做 perp-perp 高频决策,3min 可稳定接住结算档。
  open_funding_lead_seconds: 180
  # 用户 2026-06-19 拍板:profit_seeking + 满仓 + 3× 起步(可调至 5×) — 最大化并发/单腿名义
  max_concurrent: 8
  max_position_usdt: 150
  # ↑ 硬顶(USDT);实际名义还受 liquidity_sizing 与 runner 预算约束,非固定满仓此数。
  # 用户 2026-06-19 拍板:3× 杠杆起步;MaxEffectiveLeverage 同时驱动开仓前设杠杆与 sizing 口径
  max_effective_leverage: 3
  # 保留保证金安全垫(不因提杠杆而移除);可用 USDT ≥ 名义/杠杆 × 此系数
  margin_safety_factor: 1.5
  # profit_seeking 加载后 open_spread_apr 强制 ≥1.5(默认 150%);此处不覆盖,由模式收紧
  close_spread_apr: 0.20
  maker_first: true
  maker_chase_rounds: 6
  maker_chase_interval_ms: 1500
  maker_deadline_seconds: 12
  # N-3: 材料级未登记腿(过滤 dust 后)冷启动自动 IOC flatten;重启后对 bybit MNT≈$9.7 等真实残留下卖单。
  # 此后任何材料级未登记腿均走 flatten,非仅 MNT。
  untracked_exposure_action: flatten

# 五策略统一资金费轮动 runner。perp-perp 执行体见 cross_venue_executor,开仓由 runner binding 派发。
# total_deployable_usdt: 绝对预算(USDT);另有 total_deployable_pct(默认见 defaults,占真实现金权益比例),二者与 equity 取 min。
unified_rotation:
  enabled: true
  live_trading_enabled: false
  # 用户 2026-06-19 拍板:profit_seeking + 满仓 + 3× 起步(可调至 5×) — 全局资金预算
  total_deployable_usdt: 435
  max_strategy_capital_usage_pct: 0
  # 2026-06-21:必须显式开启,否则 RotationConfigFromUnified 会用零值 false 覆盖默认 true,
  # 导致 perp-perp 名义不按"各所可用×杠杆"封顶,死顶 80→所需正好等于可用→49.99<50 每轮被执行闸拒(H 永远开不出来)。
  capital_aware_perp_perp_sizing_enabled: true
  # 资金封顶安全垫:按 99% 可用反解名义,使所需保证金严格小于实时 perp 可用,避免 reserve/取整 drift 几分钱误拒。
  capital_sizing_safety_haircut: 0.99

# 多所编排（§7 / §8）。2026-06-15 起生产形态【仅跨所 perp-perp】;下列单所配置保留供回滚/对照。
venues:
  binance:
    enabled: true
  okx:
    enabled: true
    funding_executor:
      live_trading_enabled: true
      # 用户 2026-06-19 拍板:单所 ~100U 账户,80U 两腿名义上限(余额闸兜底,勿设满余额必拒)
      max_position_usdt: 80
      lead_seconds: 240
  gate:
    enabled: true
    funding_executor:
      live_trading_enabled: true
      # 用户 2026-06-19 拍板:单所 ~100U 账户,80U 两腿名义上限(余额闸兜底,勿设满余额必拒)
      max_position_usdt: 80
      lead_seconds: 240
  bybit:
    enabled: true
    autostart: false
    # 用户 2026-06-19 拍板:Bybit ~100U 分配本金(定量基准;0=永不开)
    allocated_capital_usdt: 100
    bybit_executor:
      live_trading_enabled: true
      top_n: 3
      min_funding_rate: 0.0002
      lead_seconds: 240
      hold_after_seconds: 20
      max_concurrent_positions: 1
      # 用户 2026-06-19 拍板:单所 ~100U,90U 两腿名义硬顶(留滑点/取整余量,余额闸兜底)
      max_position_notional_usdt: 90
      roll_enabled: true
      max_hold_settlements: 12
      # 用户 2026-06-19 拍板:3× 永续杠杆起步(代码硬顶 3x)
      perp_leverage: 3
      ev_gate_enabled: true
      perp_maker_first: true
      enable_negative_carry: true
      borrow_cost_hourly: 0.00003
