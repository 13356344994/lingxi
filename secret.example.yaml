# 这是一个示例配置文件，请复制为 secret.yaml 并填入你自己的真实信息。
# ！！！警告：绝不要将包含真实密钥的 secret.yaml 提交到版本控制中 ！！！
api: "YOUR_BINANCE_API_KEY"
secret: "YOUR_BINANCE_API_SECRET"
proxy_url: "http://127.0.0.1:7890"

# Telegram 通知(可选)。同时填好 Token 与 Chat_ID 即自动启用:
#   - 开仓 / 平仓 / 周期收益:每笔都推送(info,不受级别过滤)
#   - 风控告警(warning/critical):熔断、裸腿、edge 衰减、pending 卡住、优雅停机等
# 两者任一为空则告警通道保持关闭。
Telegram_Token: "YOUR_TELEGRAM_BOT_TOKEN"
Telegram_Chat_ID: "YOUR_TELEGRAM_CHAT_ID"
