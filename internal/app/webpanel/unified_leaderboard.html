<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>统一机会排行榜</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    .container { max-width: 2200px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 8px 0; }
    .meta { color: #94a3b8; margin-bottom: 20px; font-size: 14px; }
    .toolbar { margin-bottom: 16px; }
    .toolbar a { color: #93c5fd; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 24px; }
    th, td { border: 1px solid #334155; padding: 6px 8px; text-align: left; vertical-align: top; }
    th { background: #1e293b; position: sticky; top: 0; z-index: 1; }
    tr:nth-child(even) { background: #111827; }
    tr.executable { background: #0f2a1a !important; }
    tr.rejected { opacity: 0.92; }
    .ok { color: #4ade80; font-weight: 600; }
    .no { color: #f87171; }
    .section { margin-top: 28px; }
    .section h2 { font-size: 16px; margin-bottom: 8px; }
    .pill { display: inline-block; background: #334155; border-radius: 999px; padding: 2px 8px; margin: 2px 4px 2px 0; font-size: 11px; }
    pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-size: 11px; }
    .funding-high { color: #fbbf24; font-weight: 600; }
    .blocker-box { background: #1e293b; border: 1px solid #475569; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; }
    .blocker-box h2 { margin: 0 0 8px 0; font-size: 15px; color: #fbbf24; }
    .hint { color: #94a3b8; font-size: 13px; margin-bottom: 12px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .tab { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
    .tab:hover { background: #334155; }
    .tab.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .tab .badge { display: inline-block; margin-left: 6px; background: rgba(255,255,255,.18); border-radius: 999px; padding: 0 7px; font-size: 11px; }
    .tab.active .badge { background: rgba(255,255,255,.28); }
    .panel { display: none; }
    .panel.active { display: block; }
    .panel-summary { color: #94a3b8; font-size: 13px; margin-bottom: 10px; }
    .empty-note { color: #64748b; font-style: italic; padding: 16px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>统一机会排行榜（只读）</h1>
    <div class="meta" id="meta">加载中…</div>
    <div class="hint">按 live 费率/价差 APR 降序排列（可执行候选置顶）；即使 EV=0 或被结构闸拒绝，仍展示原始费率与市场信息。</div>
    <div class="toolbar"><a href="/">← 返回主面板</a> · <button id="refresh">刷新</button></div>
    <div id="error" class="error"></div>

    <div class="blocker-box">
      <h2>主要拒绝原因 Top</h2>
      <div id="reject-top"></div>
    </div>

    <div class="tabs" id="tabs"></div>
    <div id="panels"></div>

    <div class="section">
      <h2>交易所资金不足 Top</h2>
      <div id="capital-top"></div>
    </div>
  </div>
  <script>
    const STRATEGY_TYPE_LABELS = {
      single_venue_spot_perp: "同所 现货-永续",
      cross_venue_spot_perp: "跨所 现货-永续",
      single_venue_perp_spot: "同所 永续-现货",
      cross_venue_perp_spot: "跨所 永续-现货",
      perp_perp: "跨所 永续-永续(PP)",
    };

    const REJECT_REASON_LABELS = {
      not_borrowable: "借不到币",
      no_spot_market: "无现货盘",
      insufficient_depth: "深度不足",
      positive_funding_v1_not_supported: "费率方向不匹配该策略",
      negative_funding_v1_not_supported: "费率方向不匹配该策略",
      funding_entry_window_not_reached: "未到结算进场窗",
      first_funding_window_ev_negative: "首窗EV为负",
      "net_ev<=0": "净EV≤0",
      "risk_adjusted_net_ev<=0": "风险调整后净EV≤0",
      requires_rebalance: "需调仓",
      open_blocked: "该标的暂禁开",
      candidate_only: "仅候选不可执行",
      borrow_over_limit: "借币超限",
      margin_stress_liquidation: "保证金压力/强平风险",
      delisting: "下市/非交易",
      max_concurrent_reached: "已达最大并发持仓",
      qty_not_tradable: "数量不可交易",
      open_failed: "开仓失败",
      execution_score_below_min: "执行分低于下限",
      "expected_hold_hours<=0": "预期持有时间为0",
      "capital_required<=0": "所需资金为0",
      expected_loss_above_limit: "预期亏损超限",
      notional_too_small: "名义过小",
      acceptable_fallback: "软补位候选",
      "(no reject reason recorded)": "（未记录拒绝原因）",
    };

    function strategyLabel(code) {
      const key = String(code || "").toLowerCase();
      return STRATEGY_TYPE_LABELS[key] || String(code || "-");
    }

    function rejectReasonLabel(raw) {
      const text = String(raw ?? "").trim();
      if (!text) { return "—"; }
      if (REJECT_REASON_LABELS[text]) { return REJECT_REASON_LABELS[text]; }
      if (text.startsWith("reject:")) { return "拒绝：" + rejectReasonLabel(text.slice(7)); }
      if (text.startsWith("EV<0")) { return text.replace(/^EV<0:?/, "EV<0："); }
      if (text.startsWith("execution<")) { return "执行分低于" + text.slice("execution<".length); }
      if (text.startsWith("recovery<")) { return "恢复质量低于" + text.slice("recovery<".length); }
      if (text.startsWith("liquidity<")) { return "流动性低于" + text.slice("liquidity<".length); }
      if (/[\u4e00-\u9fff]/.test(text)) { return text; }
      return text;
    }

    function rejectReasonsLabel(list) {
      if (!Array.isArray(list) || !list.length) { return "—"; }
      return list.map(rejectReasonLabel).join("\n");
    }

    function fmt(n, d) { return (n == null || Number.isNaN(n)) ? '—' : Number(n).toFixed(d ?? 4); }
    function pct(n) { return (n == null || Number.isNaN(n) || n === 0) ? '—' : (Number(n)*100).toFixed(2)+'%'; }
    function pctRate(n) { return (n == null || Number.isNaN(n) || n === 0) ? '—' : (Number(n)*100).toFixed(4)+'%'; }
    function usdt(n) { return (n == null || Number.isNaN(n)) ? '—' : Number(n).toFixed(2); }
    function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

    // formatTimeUTC8 将 ISO/RFC3339 格式化为北京时间; withSuffix=false 时省略 (UTC+8) 后缀。
    function formatTimeUTC8(value, opts) {
      const withSuffix = !opts || opts.withSuffix !== false;
      const text = String(value ?? '').trim();
      if (!text) return '—';
      const d = new Date(text);
      if (Number.isNaN(d.getTime())) return esc(text);
      const parts = new Intl.DateTimeFormat('zh-CN', {
        timeZone: 'Asia/Shanghai',
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: false,
      }).formatToParts(d);
      const pick = (type) => parts.find((p) => p.type === type)?.value || '00';
      const formatted = `${pick('year')}-${pick('month')}-${pick('day')} ${pick('hour')}:${pick('minute')}:${pick('second')}`;
      return withSuffix ? `${formatted} (UTC+8)` : formatted;
    }

    function formatTimeHM(value) {
      const text = String(value ?? '').trim();
      if (!text) return '—';
      const d = new Date(text);
      if (Number.isNaN(d.getTime())) return esc(text);
      const parts = new Intl.DateTimeFormat('zh-CN', {
        timeZone: 'Asia/Shanghai',
        hour: '2-digit', minute: '2-digit', hour12: false,
      }).formatToParts(d);
      const pick = (type) => parts.find((p) => p.type === type)?.value || '00';
      return `${pick('hour')}:${pick('minute')}`;
    }

    function fundingLegSpan(venue, timeStr, isNearest) {
      if (!timeStr) return '—';
      const cls = isNearest ? ' funding-high' : '';
      return `<span class="${cls.trim()}">${esc(venue || '?')} ${formatTimeHM(timeStr)}</span>`;
    }

    function formatNextFundingTimes(o) {
      const high = o.high_next_funding_time;
      const low = o.low_next_funding_time;
      const venues = o.venues || [];
      const highVenue = venues[0] || 'H';
      const lowVenue = venues[1] || 'L';

      if (high && low) {
        const highDate = new Date(high);
        const lowDate = new Date(low);
        if (!Number.isNaN(highDate.getTime()) && !Number.isNaN(lowDate.getTime())) {
          if (highDate.getTime() === lowDate.getTime()) {
            return fundingLegSpan(highVenue, high, false);
          }
          const now = Date.now();
          const highDelta = highDate.getTime() - now;
          const lowDelta = lowDate.getTime() - now;
          const highNear = highDelta <= lowDelta;
          const nearVenue = highNear ? highVenue : lowVenue;
          const nearTime = highNear ? high : low;
          const farVenue = highNear ? lowVenue : highVenue;
          const farTime = highNear ? low : high;
          return fundingLegSpan(nearVenue, nearTime, true) + ' / ' + fundingLegSpan(farVenue, farTime, false);
        }
      }
      if (high) return fundingLegSpan(highVenue, high, false);
      if (low) return fundingLegSpan(lowVenue, low, false);
      return formatTimeUTC8(o.next_funding_time, { withSuffix: false });
    }

    function fmtCapitalByVenue(map) {
      if (!map || typeof map !== 'object') return '—';
      const entries = Object.entries(map).filter(([, v]) => v != null && !Number.isNaN(v));
      if (!entries.length) return '—';
      return entries.map(([v, n]) => `<span class="pill">${esc(v)} ${usdt(n)}</span>`).join('');
    }

    function yesNo(val) {
      return val ? '<span class="ok">是</span>' : '<span class="no">否</span>';
    }

    const TABLE_HEAD =
      '<thead><tr>'+
      '<th>#</th><th>策略</th><th>交易对</th><th>交易所</th>'+
      '<th>价差 APR</th><th>费率 APR</th><th>高腿费率</th><th>低腿费率</th>'+
      '<th>结算周期(h)</th><th>下次结算(北京)</th><th>距结算(min)</th>'+
      '<th>预计资金费(USDT)</th><th>净 EV(USDT)</th><th>资本效率</th><th>名义(USDT)</th>'+
      '<th>各腿占用(USDT)</th><th>可执行</th><th>轮换可开</th><th>拒绝原因</th>'+
      '</tr></thead>';

    function rowHTML(o) {
      const cls = o.would_execute ? 'executable' : 'rejected';
      const aprClass = (o.landscape_sort_key > 0.5) ? 'funding-high' : '';
      return '<tr class="'+cls+'">'+
        '<td>'+o.rank+'</td>'+
        '<td>'+esc(strategyLabel(o.strategy_type))+'</td>'+
        '<td>'+esc(o.symbol)+'</td>'+
        '<td>'+(o.venues||[]).map(v=>'<span class="pill">'+esc(v)+'</span>').join('')+'</td>'+
        '<td class="'+aprClass+'">'+pct(o.spread_apr)+'</td>'+
        '<td class="'+aprClass+'">'+pct(o.funding_apr)+'</td>'+
        '<td>'+pctRate(o.high_funding_rate)+'</td>'+
        '<td>'+pctRate(o.low_funding_rate)+'</td>'+
        '<td>'+(o.funding_interval_hours || '—')+'</td>'+
        '<td>'+formatNextFundingTimes(o)+'</td>'+
        '<td>'+fmt(o.minutes_until_funding,0)+'</td>'+
        '<td>'+usdt(o.expected_funding_usdt)+'</td>'+
        '<td>'+usdt(o.expected_net_ev_usdt)+'</td>'+
        '<td>'+fmt(o.capital_efficiency_score,6)+'</td>'+
        '<td>'+usdt(o.notional_usdt)+'</td>'+
        '<td>'+fmtCapitalByVenue(o.capital_required_by_venue)+'</td>'+
        '<td>'+yesNo(o.would_execute)+'</td>'+
        '<td>'+yesNo(o.rotation_would_execute)+'</td>'+
        '<td><pre>'+esc(rejectReasonsLabel(o.reject_reasons))+'</pre></td>';
    }

    function tableHTML(opportunities) {
      if (!opportunities || !opportunities.length) {
        return '<div class="empty-note">本组当前无候选。</div>';
      }
      return '<table>'+TABLE_HEAD+'<tbody>'+opportunities.map(rowHTML).join('')+'</tbody></table>';
    }

    let activeTab = 'total';
    function selectTab(key) {
      activeTab = key;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.key === key));
      document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.dataset.key === key));
    }

    async function load() {
      const errEl = document.getElementById('error');
      errEl.textContent = '';
      try {
        const res = await fetch('/api/unified/leaderboard?limit=50', {
          headers: { 'X-Dashboard-Token': (window.localStorage.getItem('lingxi-dashboard-token') || '') }
        });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        document.getElementById('meta').innerHTML =
          '周期: <strong>'+esc(data.cycle_id || '—')+'</strong> · '+
          '候选 '+data.total_candidates+' · 可执行 '+data.would_execute_count+' · '+
          esc(data.generated_at)+'<br>数据源: '+esc(data.source_path);

        // 构造 tab 组:总排行 + 各策略(后端 strategies 已固定顺序)。
        const groups = [{
          key: 'total', label: '总排行',
          total: data.total_candidates, exec: data.would_execute_count,
          opportunities: data.opportunities || [],
        }];
        (data.strategies || []).forEach(s => {
          groups.push({
            key: s.strategy_type,
            label: strategyLabel(s.strategy_type),
            total: s.total_candidates,
            exec: s.would_execute_count,
            opportunities: s.opportunities || [],
          });
        });

        document.getElementById('tabs').innerHTML = groups.map(g =>
          '<div class="tab" data-key="'+esc(g.key)+'">'+esc(g.label)+
          '<span class="badge">'+g.total+' / '+g.exec+'★</span></div>'
        ).join('');
        document.getElementById('panels').innerHTML = groups.map(g =>
          '<div class="panel" data-key="'+esc(g.key)+'">'+
          '<div class="panel-summary">候选 '+g.total+' · 可执行 '+g.exec+'（★ 表示可执行数）</div>'+
          tableHTML(g.opportunities)+
          '</div>'
        ).join('');
        document.querySelectorAll('.tab').forEach(t =>
          t.addEventListener('click', () => selectTab(t.dataset.key)));
        // 保持当前选中的 tab(刷新后不跳回总榜);若该 tab 不存在则回退总榜。
        if (!groups.some(g => g.key === activeTab)) activeTab = 'total';
        selectTab(activeTab);

        document.getElementById('reject-top').innerHTML = (data.reject_reasons_top||[]).length
          ? '<table><tr><th>原因</th><th>次数</th></tr>'+
            data.reject_reasons_top.map(r=>'<tr><td>'+esc(rejectReasonLabel(r.reason))+'</td><td><strong>'+r.count+'</strong></td></tr>').join('')+
            '</table>'
          : '<em>无</em>';
        document.getElementById('capital-top').innerHTML = (data.venue_capital_insufficient_top||[]).length
          ? '<table><tr><th>交易所</th><th>次数</th></tr>'+
            data.venue_capital_insufficient_top.map(r=>'<tr><td>'+esc(r.venue)+'</td><td>'+r.count+'</td></tr>').join('')+
            '</table>'
          : '<em>无</em>';
      } catch (e) {
        errEl.textContent = '加载失败: '+e.message;
      }
    }
    document.getElementById('refresh').addEventListener('click', load);
    load();
  </script>
</body>
</html>
