<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>统一机会排行榜</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    .container { max-width: 1600px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 8px 0; }
    .meta { color: #94a3b8; margin-bottom: 20px; font-size: 14px; }
    .toolbar { margin-bottom: 16px; }
    .toolbar a { color: #93c5fd; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 24px; }
    th, td { border: 1px solid #334155; padding: 6px 8px; text-align: left; vertical-align: top; }
    th { background: #1e293b; position: sticky; top: 0; z-index: 1; }
    tr:nth-child(even) { background: #111827; }
    tr.executable { background: #0f2a1a !important; }
    tr.rejected { opacity: 0.92; }
    .ok { color: #4ade80; font-weight: 600; }
    .no { color: #f87171; }
    .section { margin-top: 28px; }
    .section h2 { font-size: 16px; margin-bottom: 8px; }
    .pill { display: inline-block; background: #334155; border-radius: 999px; padding: 2px 8px; margin: 2px 4px 2px 0; font-size: 11px; }
    pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-size: 11px; }
    .funding-high { color: #fbbf24; font-weight: 600; }
    .blocker-box { background: #1e293b; border: 1px solid #475569; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; }
    .blocker-box h2 { margin: 0 0 8px 0; font-size: 15px; color: #fbbf24; }
    .hint { color: #94a3b8; font-size: 13px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>统一机会排行榜（只读）</h1>
    <div class="meta" id="meta">加载中…</div>
    <div class="hint">按 live 费率/价差 APR 降序排列（可执行候选置顶）；即使 EV=0 或被结构闸拒绝，仍展示原始费率与市场信息。</div>
    <div class="toolbar"><a href="/">← 返回主面板</a> · <button id="refresh">刷新</button></div>
    <div id="error" class="error"></div>

    <div class="blocker-box">
      <h2>主要拒绝原因 Top</h2>
      <div id="reject-top"></div>
    </div>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>策略</th>
          <th>交易对</th>
          <th>交易所</th>
          <th>价差 APR</th>
          <th>费率 APR</th>
          <th>原始费率</th>
          <th>美元/时</th>
          <th>间隔 h</th>
          <th>下次结算</th>
          <th>距结算 min</th>
          <th>预计资金费</th>
          <th>净 EV</th>
          <th>名义</th>
          <th>可执行</th>
          <th>拒绝原因</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <div class="section">
      <h2>交易所资金不足 Top</h2>
      <div id="capital-top"></div>
    </div>
  </div>
  <script>
    const STRATEGY_TYPE_LABELS = {
      single_venue_spot_perp: "同所 现货-永续",
      cross_venue_spot_perp: "跨所 现货-永续",
      single_venue_perp_spot: "同所 永续-现货",
      cross_venue_perp_spot: "跨所 永续-现货",
      perp_perp: "跨所 永续-永续(PP)",
    };

    const REJECT_REASON_LABELS = {
      not_borrowable: "借不到币",
      no_spot_market: "无现货盘",
      insufficient_depth: "深度不足",
      positive_funding_v1_not_supported: "费率方向不匹配该策略",
      negative_funding_v1_not_supported: "费率方向不匹配该策略",
      funding_entry_window_not_reached: "未到结算进场窗",
      first_funding_window_ev_negative: "首窗EV为负",
      "net_ev<=0": "净EV≤0",
      "risk_adjusted_net_ev<=0": "风险调整后净EV≤0",
      requires_rebalance: "需调仓",
      open_blocked: "该标的暂禁开",
      candidate_only: "仅候选不可执行",
      borrow_over_limit: "借币超限",
      margin_stress_liquidation: "保证金压力/强平风险",
      delisting: "下市/非交易",
      max_concurrent_reached: "已达最大并发持仓",
      qty_not_tradable: "数量不可交易",
      open_failed: "开仓失败",
      execution_score_below_min: "执行分低于下限",
      "expected_hold_hours<=0": "预期持有时间为0",
      "capital_required<=0": "所需资金为0",
      expected_loss_above_limit: "预期亏损超限",
      notional_too_small: "名义过小",
      acceptable_fallback: "软补位候选",
      "(no reject reason recorded)": "（未记录拒绝原因）",
    };

    function strategyLabel(code) {
      const key = String(code || "").toLowerCase();
      return STRATEGY_TYPE_LABELS[key] || String(code || "-");
    }

    function rejectReasonLabel(raw) {
      const text = String(raw ?? "").trim();
      if (!text) { return "—"; }
      if (REJECT_REASON_LABELS[text]) { return REJECT_REASON_LABELS[text]; }
      if (text.startsWith("reject:")) { return "拒绝：" + rejectReasonLabel(text.slice(7)); }
      if (text.startsWith("EV<0")) { return text.replace(/^EV<0:?/, "EV<0："); }
      if (text.startsWith("execution<")) { return "执行分低于" + text.slice("execution<".length); }
      if (text.startsWith("recovery<")) { return "恢复质量低于" + text.slice("recovery<".length); }
      if (text.startsWith("liquidity<")) { return "流动性低于" + text.slice("liquidity<".length); }
      if (/[\u4e00-\u9fff]/.test(text)) { return text; }
      return text;
    }

    function rejectReasonsLabel(list) {
      if (!Array.isArray(list) || !list.length) { return "—"; }
      return list.map(rejectReasonLabel).join("\n");
    }

    function fmt(n, d) { return (n == null || Number.isNaN(n)) ? '—' : Number(n).toFixed(d ?? 4); }
    function pct(n) { return (n == null || Number.isNaN(n) || n === 0) ? '—' : (Number(n)*100).toFixed(2)+'%'; }
    function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
    function fmtTime(s) {
      if (!s) return '—';
      try { return new Date(s).toLocaleString('zh-CN', {hour12:false}); } catch { return esc(s); }
    }
    async function load() {
      const errEl = document.getElementById('error');
      errEl.textContent = '';
      try {
        const res = await fetch('/api/unified/leaderboard?limit=50', {
          headers: { 'X-Dashboard-Token': (window.localStorage.getItem('lingxi-dashboard-token') || '') }
        });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        document.getElementById('meta').innerHTML =
          '周期: <strong>'+esc(data.cycle_id || '—')+'</strong> · '+
          '候选 '+data.total_candidates+' · 可执行 '+data.would_execute_count+' · '+
          esc(data.generated_at)+'<br>数据源: '+esc(data.source_path);
        const tbody = document.getElementById('rows');
        tbody.innerHTML = '';
        (data.opportunities || []).forEach(o => {
          const tr = document.createElement('tr');
          if (o.would_execute) tr.className = 'executable';
          else tr.className = 'rejected';
          const aprClass = (o.landscape_sort_key > 0.5) ? 'funding-high' : '';
          tr.innerHTML =
            '<td>'+o.rank+'</td>'+
            '<td>'+esc(strategyLabel(o.strategy_type))+'</td>'+
            '<td>'+esc(o.symbol)+'</td>'+
            '<td>'+(o.venues||[]).map(v=>'<span class="pill">'+esc(v)+'</span>').join('')+'</td>'+
            '<td class="'+aprClass+'">'+pct(o.spread_apr)+'</td>'+
            '<td class="'+aprClass+'">'+pct(o.funding_apr)+'</td>'+
            '<td>'+fmt(o.raw_funding_rate,6)+'</td>'+
            '<td>'+fmt(o.funding_rate_per_hour,6)+'</td>'+
            '<td>'+(o.funding_interval_hours || '—')+'</td>'+
            '<td>'+fmtTime(o.next_funding_time)+'</td>'+
            '<td>'+fmt(o.minutes_until_funding,0)+'</td>'+
            '<td>'+fmt(o.expected_funding_usdt,4)+'</td>'+
            '<td>'+fmt(o.expected_net_ev_usdt,4)+'</td>'+
            '<td>'+fmt(o.notional_usdt,2)+'</td>'+
            '<td class="'+(o.would_execute?'ok':'no')+'">'+(o.would_execute?'是':'否')+'</td>'+
            '<td><pre>'+esc(rejectReasonsLabel(o.reject_reasons))+'</pre></td>';
          tbody.appendChild(tr);
        });
        document.getElementById('reject-top').innerHTML = (data.reject_reasons_top||[]).length
          ? '<table><tr><th>原因</th><th>次数</th></tr>'+
            data.reject_reasons_top.map(r=>'<tr><td>'+esc(rejectReasonLabel(r.reason))+'</td><td><strong>'+r.count+'</strong></td></tr>').join('')+
            '</table>'
          : '<em>无</em>';
        document.getElementById('capital-top').innerHTML = (data.venue_capital_insufficient_top||[]).length
          ? '<table><tr><th>交易所</th><th>次数</th></tr>'+
            data.venue_capital_insufficient_top.map(r=>'<tr><td>'+esc(r.venue)+'</td><td>'+r.count+'</td></tr>').join('')+
            '</table>'
          : '<em>无</em>';
      } catch (e) {
        errEl.textContent = '加载失败: '+e.message;
      }
    }
    document.getElementById('refresh').addEventListener('click', load);
    load();
  </script>
</body>
</html>
